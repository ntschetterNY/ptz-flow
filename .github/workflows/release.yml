name: Release

# Publish a GitHub release with a tag like v0.2.0. This builds the app and attaches the zip.
# Installed copies of PTZ Flow see the new release and show a notice with a link to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh "${{ github.event.release.tag_name }}"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/PTZ-Flow-*.zip --clobber
